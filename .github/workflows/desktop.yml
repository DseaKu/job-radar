name: Desktop app

# Builds the installers of the desktop app (gui/) for each operating system.
# Tauri cannot cross-compile, so each system builds on its own runner, at the same time.
#   manual start (Actions tab) -> the installers are artifacts of the run
#   tag v1.2.3                 -> also a draft GitHub release with the installers, version 1.2.3
#
#   macOS    .dmg            universal: Apple Silicon and Intel
#   Windows  .msi, -setup.exe x64 (runs on ARM too, through emulation)
#   Linux    .deb, .rpm      x64 and ARM64; also .AppImage on x64
#
# The apps are not signed with a paid certificate. On first start, macOS and Windows show a
# warning that the user must confirm once (see the README).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: windows-x64
            runner: windows-latest
            args: ""
          - name: linux-x64
            runner: ubuntu-22.04
            args: ""
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            args: --bundles deb,rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 22.04 (not 24.04): the older system library makes packages that run on more systems.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
        working-directory: gui

      - name: Build
        working-directory: gui
        env:
          ARGS: ${{ matrix.args }}
        run: |
          args=($ARGS)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=(--config "{\"version\": \"${GITHUB_REF_NAME#v}\"}")
          fi
          npm run tauri build -- "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: job-radar-${{ matrix.name }}
          path: |
            gui/src-tauri/target/**/release/bundle/dmg/*.dmg
            gui/src-tauri/target/**/release/bundle/msi/*.msi
            gui/src-tauri/target/**/release/bundle/nsis/*.exe
            gui/src-tauri/target/**/release/bundle/deb/*.deb
            gui/src-tauri/target/**/release/bundle/rpm/*.rpm
            gui/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: job-radar-*
      - name: Draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=(dist/**/*.{dmg,msi,exe,deb,rpm,AppImage})
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Job Radar $GITHUB_REF_NAME"
