[package]
name = "job-radar-gui"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Desktop app for job_radar"
publish = false

[lib]
name = "job_radar_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
job_radar = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
dotenvy = "0.15.7"
reqwest = { version = "0.12", features = ["json"] }
