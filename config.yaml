# Agent settings. Set AGENTS_CONFIG to use a different file.

# The provider entry to use. To switch, change this one line.
active: claude

# Language for "description" and "match_reason" in the CSV (for example English, German).
# Job titles, company names and locations stay as they appear on the page.
output_language: German

# The search pages are in sources.yaml (private, not in Git).
# Template: sources.example.yaml.

# Each entry needs a `type` and a `model`. Optional fields:
#   base_url     - API address (each type has a default)
#   api_key_env  - environment variable that holds the token (set it in your shell or .env)
#   max_tokens   - upper limit for each reply (default 4096)
#   effort       - how much the model thinks before it replies (default: the model's own default)
#                  anthropic: low | medium | high | xhigh | max
#                  openai: sent as reasoning_effort (only reasoning models accept it)
#                  ollama: any value turns thinking on; without it, thinking is off
#   context_length - ollama only: context window in tokens (default 32768).
#                  Ollama's own default is about 2048 and cuts long prompts without an error.
#                  A larger window needs more memory (qwen3:8b at 32768: about 10 GB).
#
# Types: ollama (local, no token), openai (any OpenAI-compatible API), anthropic (Claude).
providers:
  local:
    type: ollama
    model: qwen3:8b
    context_length: 32768

  claude:
    type: anthropic
    model: claude-haiku-5-5
    effort: medium
    max_tokens: 16000   # a page with many jobs needs a long reply
    # model: claude-sonnet-5-5

  openai:
    type: openai
    model: gpt-4o-mini

  openrouter:
    type: openai
    model: meta-llama/llama-3.3-70b-instruct
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
