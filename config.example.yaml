# Template for your settings. Copy it, then change the copy:
#
#   cp config.example.yaml config.yaml
#
# Git ignores config.yaml, so your settings stay private.
# Without config.yaml, job_radar uses Ollama with qwen3:1.7b and English output.
# Use another file with AGENTS_CONFIG=<path>.

# The provider entry to use. To switch, change this one line.
# The default `local` needs no API key: install Ollama, then run `ollama pull qwen3:1.7b`.
active: local

# Language for "description" and "match_reason" in the CSV (for example English, German).
# Job titles, company names and locations stay as they appear on the page.
output_language: English

# Extra instructions for the AI when it finds and rates the jobs. Optional.
# Write them as normal sentences. The AI still replies in the fixed CSV format.
# Examples:
#   extra_instructions: |
#     I look for a working-student job, 20 hours a week. Rate full-time jobs lower.
#     Rate jobs with Rust or embedded systems higher.
#     Remote or hybrid jobs are a plus.
#     Ignore jobs in sales, marketing and management.
extra_instructions: ""

# Cover letters: `job_radar application <number|url>` or "Write application" in the app.
# Each letter is a LaTeX file (cover_letter.tex) in its own folder in applications_dir.
# If LaTeX is installed, the PDF (cover_letter.pdf) is built automatically.
# Your data and your own LaTeX layout: letter.yaml (template: letter.example.yaml).
# A relative path starts in the current folder; ~ is your home folder. See docs/applications.md.
applications_dir: applications

# Extra instructions for the cover letters. Optional.
# Without them, the letter is in the language of the job posting.
# Examples:
#   application_instructions: |
#     I can start on 1 March.
#     Write the letter in English.
application_instructions: ""

# The search pages are in sources.yaml (private, not in Git).
# Template: sources.example.yaml.

# Each entry needs a `type` and a `model`. Optional fields:
#   base_url     - API address (each type has a default)
#   api_key_env  - environment variable that holds the token (set it in your shell or .env)
#   max_tokens   - upper limit for each reply (default 4096)
#   effort       - how much the model thinks before it replies (default: the model's own default)
#                  anthropic: low | medium | high | xhigh | max
#                  openai: sent as reasoning_effort (only reasoning models accept it)
#                  ollama: any value turns thinking on; without it, thinking is off
#   context_length - context window in tokens (prompt + reply). Long pages are read in parts that fit into it.
#                  Defaults: ollama 32768, openai 128000, anthropic 200000.
#                  A smaller value also limits the cost for each page on paid APIs.
#                  ollama: also sent as num_ctx. Ollama's own default is about 2048 and cuts
#                  long prompts without an error. A larger window needs more memory
#                  (qwen3:8b at 32768: about 10 GB).
#   temperature  - sampling temperature; 0 gives the same reply for the same input
#                  (default: the provider's own default)
#   timeout      - upper limit in seconds for one AI request (default: ollama 600, others 300).
#                  After it, the request stops with a clear error instead of waiting.
#   extra_body   - extra top-level fields for the JSON body of each request, for example
#                  extra_body: {"mode": "non-private"}. A field that the request already has
#                  is replaced. Do not put API keys here: they stay in .env.
#
# Types: ollama (local, no token), openai (any OpenAI-compatible API), anthropic (Claude).
providers:
  local:
    type: ollama
    model: qwen3:1.7b        # small and fast; qwen3:8b gives better results (about 5 GB)
    context_length: 32768

  claude:
    type: anthropic
    model: claude-haiku-5-5
    effort: low
    max_tokens: 16000   # a page with many jobs needs a long reply
    # model: claude-sonnet-5-5

  openai:
    type: openai
    model: gpt-4o-mini

  openrouter:
    type: openai
    model: meta-llama/llama-3.3-70b-instruct
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
