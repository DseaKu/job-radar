[package]
name = "job_radar"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Finds job postings on career pages and rates them against your CV with an LLM"
repository = "https://github.com/DseaKu/job-radar"

[dependencies]
dotenvy = "0.15.7"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["full"] }
csv = "1"
pdf-extract = "0.12.1"
