<rect x="24" y="656" width="46" height="24" rx="12" fill="#ffebe9"/><text x="47" y="673" text-anchor="middle" font-weight="700" font-size="13" fill="#cf222e">18</text>
<text x="96" y="672" font-size="13.5" fill="#1f2328" font-weight="600">Senior Cloud Architect AWS</text>
<text x="96" y="690" font-size="13.5" fill="#1f2328" font-weight="600">(m/w/d)</text>
<text x="372" y="672" font-size="13.5" fill="#1f2328">Nordlicht Robotics</text>
<text x="372" y="690" font-size="13.5" fill="#1f2328">GmbH</text>
<text x="568" y="672" font-size="13.5" fill="#59636e">Munich</text>
<text x="748" y="672" font-size="13.5" fill="#59636e">Senior level, leadership experience and the location Munich do not</text>
