<text x="568" y="288" font-size="13.5" fill="#59636e">Witten</text>
<text x="748" y="288" font-size="13.5" fill="#59636e">Entry-level role in the home town with C, C++, Linux and Git, all</text>
<text x="748" y="306" font-size="13.5" fill="#59636e">listed in the CV.</text>
