<text x="372" y="608" font-size="13.5" fill="#1f2328">Fernweh Media GmbH</text>
<text x="568" y="608" font-size="13.5" fill="#59636e">Essen (22 km),</text>
<text x="568" y="626" font-size="13.5" fill="#59636e">Remote possible</text>
<text x="748" y="608" font-size="13.5" fill="#59636e">Little overlap: the CV focuses on embedded systems, not on marketing</text>
