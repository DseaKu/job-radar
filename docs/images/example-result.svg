<rect x="24" y="272" width="46" height="24" rx="12" fill="#dafbe1"/><text x="47" y="289" text-anchor="middle" font-weight="700" font-size="13" fill="#1a7f37">81</text>
<text x="96" y="288" font-size="13.5" fill="#1f2328" font-weight="600">Junior Software Engineer C/C++</text>
<text x="96" y="306" font-size="13.5" fill="#1f2328" font-weight="600">(m/w/d)</text>
