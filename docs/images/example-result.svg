<text x="96" y="498" font-size="13.5" fill="#1f2328" font-weight="600">(m/w/d)</text>
<text x="372" y="480" font-size="13.5" fill="#1f2328">Nordlicht Robotics</text>
<text x="372" y="498" font-size="13.5" fill="#1f2328">GmbH</text>
<text x="568" y="480" font-size="13.5" fill="#59636e">Bochum (12 km)</text>
<text x="748" y="480" font-size="13.5" fill="#59636e">Python is in the CV, but backend frameworks and the required 3 years</text>
