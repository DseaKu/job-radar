<text x="96" y="160" font-size="13.5" fill="#1f2328" font-weight="600">Embedded Rust Developer</text>
<text x="96" y="178" font-size="13.5" fill="#1f2328" font-weight="600">(m/w/d)</text>
<text x="372" y="160" font-size="13.5" fill="#1f2328">Nordlicht Robotics</text>
<text x="372" y="178" font-size="13.5" fill="#1f2328">GmbH</text>
<text x="568" y="160" font-size="13.5" fill="#59636e">Bochum (12 km),</text>
<text x="568" y="178" font-size="13.5" fill="#59636e">Hybrid</text>
<text x="748" y="160" font-size="13.5" fill="#59636e">Rust, ARM Cortex-M and CAN experience from the working-student role</text>
<text x="748" y="178" font-size="13.5" fill="#59636e">and the thesis match the core of the role.</text>
